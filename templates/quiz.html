{% extends "base.html" %}

{% block title %}Quiz - Python Pro{% endblock %}

{% block content %}
<h1 style="text-align: center; margin-top: 0;">Quiz</h1>

<form method="POST" action="/">
    <div style="margin-bottom: 24px;">
        <label for="username" style="display: block; font-weight: bold; margin-bottom: 8px;">Adınız:</label>
        <input type="text" id="username" name="username" value="{{ username }}" placeholder="Adınızı girin" required
               style="width: 100%; padding: 10px; font-size: 15px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;">
    </div>

    {% for q in questions %}
    <div style="margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid #eee;">
        <div style="font-size: 12px; color: #666; margin-bottom: 4px;">Konu: {{ q.topic }}</div>
        <div style="font-weight: bold; font-size: 16px; margin-bottom: 10px;">
            Question {{ q.id }}: {{ q.question }}
        </div>
        {% for opt in q.options %}
        <label style="display: block; background: #f8f9fa; border: 1px solid #e0e0e0; padding: 10px 14px; margin-bottom: 8px; border-radius: 5px; cursor: pointer;">
            <input type="radio" name="question_{{ q.id }}" value="{{ opt }}" required style="margin-right: 8px;">
            {{ opt }}
        </label>
        {% endfor %}
    </div>
    {% endfor %}

    <button type="submit" class="btn-green" style="width: 100%;">Gönder</button>
</form>
{% endblock %}
